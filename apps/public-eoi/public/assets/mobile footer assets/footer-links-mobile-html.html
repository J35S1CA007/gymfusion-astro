<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GYMFUSION Footer Links Mobile</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      height: 100%;
    }

    .footer-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: transparent;
      flex-wrap: nowrap;
    }

    .footer-links a {
      flex: 1 1 0;
      min-width: 0;
      color: #ffffff;
      background: transparent;
      border: 2px solid #ffffff;
      box-shadow: 4px 4px 0 #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: clamp(30px, 7vw, 36px);
      padding: 0 clamp(7px, 2.2vw, 16px);
      font-size: clamp(10px, 2.4vw, 13px);
      font-weight: 800;
      letter-spacing: clamp(0.15px, 0.12vw, 0.4px);
      line-height: 1;
      text-transform: uppercase;
      text-decoration: none;
      white-space: nowrap;
      transition: background 160ms ease, border-color 160ms ease, box-shadow 160ms ease, color 160ms ease, transform 160ms ease;
    }

    .footer-links a:hover,
    .footer-links a:active,
    .footer-links a:focus {
      color: #000000;
      background: #f26a21;
      border-color: #f26a21;
      box-shadow: 4px 4px 0 #ffffff;
      outline: none;
      transform: translate(-1px, -1px);
    }

    .footer-links a:active {
      box-shadow: 1px 1px 0 #ffffff;
      transform: translate(2px, 2px);
    }

    @media (max-width: 420px) {
      .footer-links {
        gap: 6px;
      }

      .footer-links a {
        font-size: clamp(10px, 2.4vw, 13px);
        padding: 0 clamp(7px, 2.2vw, 12px);
      }
    }
  </style>
</head>
<body>
  <nav class="footer-links" aria-label="Footer links">
    <a href="https://www.gymfusion.com.au/privacy-policy" target="_top">PRIVACY</a>
    <a href="https://www.gymfusion.com.au/accessibility-inclusion-statement" target="_top">ACCESSIBILITY</a>
    <a href="https://www.gymfusion.com.au/terms-and-conditions" target="_top">T&amp;CS</a>
  </nav>

<script>
(() => {
  const EMBED_ID = "footer-links-mobile-html";
  const registry = window.__GYMFUSION_READY_PROTOCOL__ || (window.__GYMFUSION_READY_PROTOCOL__ = {});

  if (registry[EMBED_ID]) {
    registry[EMBED_ID].markReady();
    return;
  }

  let ready = false;
  let sent = false;

  const emit = (force = false) => {
    if (!ready || (!force && sent) || window.parent === window) {
      return;
    }

    sent = true;

    try {
      window.parent.postMessage(
        {
          type: "GYMFUSION_READY",
          version: 1,
          embedId: EMBED_ID,
        },
        "*"
      );
    } catch {
      // Ignore cross-origin failures outside a supported iframe context.
    }
  };

  const markReady = () => {
    ready = true;
    emit();
  };

  const onMessage = (event) => {
    const data = event.data;
    if (!data || typeof data !== "object") {
      return;
    }

    if (data.type === "GYMFUSION_READY_REQUEST" && data.version === 1) {
      emit(true);
    }
  };

  window.addEventListener("message", onMessage);
  registry[EMBED_ID] = { markReady, onMessage };
  markReady();
})();
</script>
</body>
</html>
